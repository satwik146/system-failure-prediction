# iot-failure-predictor configuration

app:
  name: "IoT Failure Predictor"
  version: "0.2.0"
  log_level: "INFO"           # DEBUG | INFO | WARNING | ERROR
  data_dir: "./data"

# ─── Performance ──────────────────────────────────────────────────────────────
performance:
  event_queue_maxsize: 512
  batch_flush_interval: 5.0
  batch_max_size: 64
  log_tail_chunk: 4096
  serial_read_timeout: 0.1

# ─── API ──────────────────────────────────────────────────────────────────────
api:
  port: 8000

# ─── MQTT (disabled by default — set enabled: true if you have a broker) ──────
mqtt:
  enabled: false
  host: "localhost"
  port: 1883
  keepalive: 60
  client_id: "iot-predictor"
  topics:
    - topic: "plant/+/sensors/#"
      qos: 1
    - topic: "machines/+/status"
      qos: 0

# ─── Modbus (disabled by default) ─────────────────────────────────────────────
modbus:
  enabled: false
  devices:
    - id: "pump_controller_01"
      host: "192.168.1.100"
      port: 502
      unit_id: 1
      poll_interval: 2.0
      registers:
        - name: "motor_rpm"
          address: 0x0001
          type: "holding"
        - name: "temperature_c"
          address: 0x0002
          type: "holding"
        - name: "vibration_hz"
          address: 0x0003
          type: "input"

# ─── Serial (disabled by default) ─────────────────────────────────────────────
serial:
  enabled: false
  devices:
    - id: "embedded_ctrl_01"
      port: "/dev/ttyUSB0"   # Windows: "COM3"
      baudrate: 9600
      bytesize: 8
      parity: "N"
      stopbits: 1
      poll_interval: 1.0
      line_terminator: "\n"

# ─── Log file tailing (ENABLED — works out of the box) ────────────────────────
log_tailing:
  enabled: true
  files:
    - id: "app_log"
      path: "./data/sample.log"   # auto-generated by main.py if missing
      encoding: "utf-8"
      tag: "app"

# ─── Simulator (ENABLED — provides live data without real hardware) ────────────
simulator:
  enabled: true
  # Virtual sensors to simulate continuously
  virtual_sources:
    - id: "pump_01"
      tags:
        temperature_c:  { base: 75.0, noise: 2.0, unit: "°C" }
        motor_rpm:      { base: 1450.0, noise: 20.0, unit: "RPM" }
        vibration_hz:   { base: 50.0, noise: 1.5, unit: "Hz" }
    - id: "compressor_01"
      tags:
        pressure_bar:   { base: 6.5, noise: 0.2, unit: "bar" }
        temperature_c:  { base: 88.0, noise: 3.0, unit: "°C" }
        current_a:      { base: 12.0, noise: 0.5, unit: "A" }
    - id: "conveyor_01"
      tags:
        speed_ms:       { base: 1.2, noise: 0.05, unit: "m/s" }
        belt_temp_c:    { base: 42.0, noise: 1.0, unit: "°C" }
  tick_interval: 2.0   # seconds between synthetic data points

# ─── Analysis thresholds ──────────────────────────────────────────────────────
analysis:
  anomaly_zscore_threshold: 3.0
  anomaly_window_size: 60
  severity_keywords:
    critical: ["CRITICAL", "FATAL", "EMERG", "kernel panic", "segfault", "OOM"]
    error:    ["ERROR", "ERR", "FAIL", "failed", "exception", "crash"]
    warning:  ["WARN", "WARNING", "timeout", "retry", "slow", "high"]
    info:     ["INFO", "OK", "success", "started", "stopped"]
