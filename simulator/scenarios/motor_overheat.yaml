name: motor_overheat
description: "Simulates gradual motor temperature rise leading to thermal shutdown"

steps:
  - source_id: pump_controller_01
    tag: temperature_c
    fault_type: drift
    target: 95.0
    duration: 60
    delay_before: 0

  - source_id: pump_controller_01
    tag: motor_rpm
    fault_type: drift
    target: 200
    duration: 40
    delay_before: 10

  - source_id: pump_controller_01
    tag: vibration_hz
    fault_type: oscillate
    magnitude: 12.0
    frequency: 0.2
    duration: 30
    delay_before: 20
